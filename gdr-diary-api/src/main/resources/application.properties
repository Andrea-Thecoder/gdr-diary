spring.application.name=gdr-diary-api

#--------------------------------------------------------------------
#            Configuration
#--------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1/gdr-diary-api
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
logging.level.root=INFO
logging.level.it.gdr.diary=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:dbinit/postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/gdr-diary-api?currentSchema=dev,public
spring.datasource.username=gdr-diary-api
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gdr-diary-dev
spring.security.oauth2.resourceserver.jwt.audiences=gdr-diary-backend
app.cors.allowed-origins=http://localhost:5173
app.storage.endpoint=http://localhost:8333
app.storage.access-key=admin
app.storage.secret-key=secret
app.storage.bucket=diary-documents
