#--------------------------------------------------------------------
#            Application
#--------------------------------------------------------------------
spring.application.name=gdr-diary-api

#--------------------------------------------------------------------
#            Server
#--------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1/gdr-diary-api

#--------------------------------------------------------------------
#            Logging
#--------------------------------------------------------------------
logging.level.root=INFO
logging.level.it.gdr.diary=DEBUG

#--------------------------------------------------------------------
#            Actuator
#--------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

#--------------------------------------------------------------------
#            Database
#--------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/gdr-diary-api?currentSchema=dev,public
spring.datasource.username=gdr-diary-api
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:dbinit/postgres

#--------------------------------------------------------------------
#            Upload (multipart)
#--------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#--------------------------------------------------------------------
#            Security (Keycloak)
#--------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gdr-diary-dev
spring.security.oauth2.resourceserver.jwt.audiences=gdr-diary-backend

#--------------------------------------------------------------------
#            Keycloak admin (account deletion)
#--------------------------------------------------------------------
app.keycloak-admin.server-url=http://localhost:8180
app.keycloak-admin.realm=gdr-diary-dev
app.keycloak-admin.client-id=gdr-diary-backend-admin
app.keycloak-admin.client-secret=secret

#--------------------------------------------------------------------
#            CORS
#--------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

#--------------------------------------------------------------------
#            Storage (S3)
#--------------------------------------------------------------------
app.storage.endpoint=http://localhost:8333
app.storage.access-key=admin
app.storage.secret-key=secret
app.storage.bucket=diary-documents
app.storage.create-buckets=true

#--------------------------------------------------------------------
#            Character sheets
#--------------------------------------------------------------------
app.character-sheet.max-sheets-per-character=10

#--------------------------------------------------------------------
#            Feedback
#--------------------------------------------------------------------
app.feedback.bucket=feedback-documents
app.feedback.max-files=3
app.feedback.max-total-file-size=5MB
app.feedback.max-technical-info-size=2KB
app.feedback.timezone=Europe/Rome
app.feedback.rate-limit-max-requests=5
app.feedback.rate-limit-window=1h
