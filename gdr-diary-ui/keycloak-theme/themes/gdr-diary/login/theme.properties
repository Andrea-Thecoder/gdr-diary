parent=base
locales=it

styles=css/gdr.css

kcFormClass = m-0 flex flex-col gap-5
kcFormGroupClass = flex flex-col gap-1.5
kcLabelWrapperClass =
kcLabelClass = font-label text-[13px] font-medium tracking-[.2em] uppercase text-label
kcInputWrapperClass = flex flex-col gap-1.5
kcInputClass = min-h-[48px] w-full rounded-[4px] border border-(color:--page-rule) bg-(--page) px-3.5 font-body text-[20px] text-page-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(color:--link) aria-invalid:border-(color:--danger)
kcInputErrorMessageClass = text-[17px] leading-snug text-danger
kcInputGroup = relative flex
kcInputRequiredClass = text-danger
kcFormPasswordVisibilityButtonClass = absolute inset-y-0 right-0 inline-flex min-h-[44px] min-w-[44px] cursor-pointer items-center justify-center text-page-soft hover:opacity-80
kcSelectClass = min-h-[48px] w-full rounded-[4px] border border-(color:--page-rule) bg-(--page) px-3 font-body text-[20px] text-page-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(color:--link)
kcTextareaClass = min-h-[96px] w-full rounded-[4px] border border-(color:--page-rule) bg-(--page) px-3.5 py-2 font-body text-[20px] text-page-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(color:--link)
kcCheckboxInputClass = size-5 shrink-0 accent-(--btn-border)
kcFormOptionsClass = flex flex-wrap items-center justify-between gap-x-4 gap-y-1
kcFormOptionsWrapperClass =
kcFormButtonsClass = flex flex-col
kcFormButtonsWrapperClass = flex flex-col
kcButtonClass = inline-flex cursor-pointer items-center justify-center rounded-[4px] border font-label uppercase hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60
kcButtonPrimaryClass = min-h-[54px] border-(color:--btn-border) px-8 text-[15px] font-semibold tracking-[.12em] text-btn-ink shadow-(--btn-shadow) surface-btn
kcButtonDefaultClass = min-h-[44px] border-(color:--nav-border) px-5 text-[13px] font-medium tracking-[.14em] text-nav-ink
kcButtonBlockClass = w-full
kcButtonLargeClass =
kcLinkClass = inline-flex min-h-[44px] cursor-pointer items-center text-soft underline underline-offset-4 hover:opacity-80
